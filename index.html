<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Biết Tuốt — E2E Digital System (LYG)</title>
<style>
:root{
  --paper:#F1F3F7;--card:#FFF;--sunk:#E8ECF3;--ink:#121722;--ink2:#4E5871;--ink3:#5F6980;
  --rule:#DBE0EA;--rule2:#C4CCDB;--ac:#2650CE;--stop:#B3271C;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0C1017;--card:#141A26;--sunk:#0F151F;--ink:#E6EAF3;--ink2:#9AA5BD;--ink3:#8A94AE;
  --rule:#232B3A;--rule2:#33405A;--ac:#7FA3FF;--stop:#FF8878;
}}
:root[data-theme="light"]{--paper:#F1F3F7;--card:#FFF;--sunk:#E8ECF3;--ink:#121722;--ink2:#4E5871;--ink3:#5F6980;--rule:#DBE0EA;--rule2:#C4CCDB;--ac:#2650CE;--stop:#B3271C}
:root[data-theme="dark"]{--paper:#0C1017;--card:#141A26;--sunk:#0F151F;--ink:#E6EAF3;--ink2:#9AA5BD;--ink3:#8A94AE;--rule:#232B3A;--rule2:#33405A;--ac:#7FA3FF;--stop:#FF8878}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:var(--paper);color:var(--ink);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.gate{width:100%;max-width:432px}
.eb{font:600 10.5px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ac);display:block;margin-bottom:10px}
h1{font:700 26px/1.2 var(--serif);letter-spacing:-.015em;margin:0 0 10px}
.sub{color:var(--ink2);font-size:14.5px;margin:0 0 22px}
form{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px;
  box-shadow:0 1px 2px rgba(18,23,34,.05),0 8px 24px -12px rgba(18,23,34,.18)}
label{font:600 10px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:7px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--rule);border-radius:8px;
  padding:11px 12px;color:var(--ink);font:15px var(--sans)}
input:focus{outline:none;border-color:var(--ac);background:var(--card)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 18px;
  font:600 14.5px var(--sans);cursor:pointer;white-space:nowrap}
button:disabled{opacity:.55;cursor:default}
button:active{transform:scale(.97)}
.msg{margin-top:12px;font-size:13.5px;min-height:20px;color:var(--ink3)}
.msg.bad{color:var(--stop)}
.note{margin-top:18px;font:11.5px/1.7 var(--mono);color:var(--ink3)}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<main class="gate">
  <span class="eb">Laiyih Group · Digital Team</span>
  <h1>Sổ tay hệ thống số nhà máy</h1>
  <p class="sub">Tài liệu nội bộ. Nội dung trang này được mã hoá — nhập mật khẩu để mở.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Mật khẩu</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <button id="go" type="submit">Mở</button>
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
  <p class="note">22 tài liệu · 543 slide · 22 hệ thống<br>AES-256-GCM · PBKDF2-SHA256 300,000 vòng</p>
</main>

<script>
(function () {
  var SALT = "DOcFR9iuUXxm4y0/qdEzoQ==", IV = "XlTzmXMCdg+T2YWj", ITER = 300000;
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg');

  function b64(s) {
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }
  function say(t, bad) { msg.textContent = t; msg.className = bad ? 'msg bad' : 'msg'; }

  async function unlock(pass, quiet) {
    if (!window.crypto || !crypto.subtle) {
      say('Trình duyệt này không hỗ trợ giải mã. Hãy dùng Chrome hoặc Safari bản mới.', true);
      return false;
    }
    go.disabled = true;
    say(quiet ? 'Đang mở…' : 'Đang giải mã, chờ vài giây…');
    try {
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var data = b64(document.getElementById('blob').textContent.trim());
      var out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, data);
      var html = new TextDecoder().decode(out);
      try { sessionStorage.setItem('e2e-pw', pass); } catch (e) { }
      document.open(); document.write(html); document.close();
      return true;
    } catch (e) {
      go.disabled = false;
      say('Mật khẩu không đúng. Kiểm tra lại hoặc hỏi Digital Team.', true);
      pw.value = ''; pw.focus();
      return false;
    }
  }

  f.addEventListener('submit', function (e) { e.preventDefault(); if (pw.value) unlock(pw.value); });

  /* mở lại tab cũ thì không phải nhập lại */
  var saved = null;
  try { saved = sessionStorage.getItem('e2e-pw'); } catch (e) { }
  if (saved) unlock(saved, true); else pw.focus();
})();
